<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .donut-canvas-wrapper { width: 145px; height: 145px; position: relative; }
  </style>
</head>
<body>
  <div class="donut-canvas-wrapper">
    <canvas id="riskDonutChart"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('riskDonutChart');
    const ctx = canvas.getContext('2d');
    const metrics = { low: 0, moderate: 0, atRisk: 30, total: 30 };
    const dataValues = [metrics.low, metrics.moderate, metrics.atRisk];
    console.log('dataValues:', dataValues);
    const chart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Not At-Risk', 'Monitor (Moderate)', 'At-Risk'],
        datasets: [{
          data: dataValues,
          backgroundColor: ['#22C55E', '#F59E0B', '#EF4444'],
          borderWidth: 2,
          borderColor: '#FFFFFF',
          hoverOffset: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '75%',
        plugins: { legend: { display: false } }
      }
    });
    console.log('chart created:', !!chart);
  </script>
</body>
</html>
